name: Web Search Canary

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web-search-canary.yml'
      - 'proxy/tests/runtime-web-search.canary.cjs'
      - 'proxy/tests/runtime-web-search.integration.cjs'
      - 'proxy/tests/run-all.cjs'
      - 'proxy/package.json'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: gen-lang-client-0462350485

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install proxy dependencies
        working-directory: proxy
        run: npm ci

      - name: Resolve Firebase Web API key
        run: |
          API_KEY=$(node -e "const fs=require('fs'); const s=fs.readFileSync('webapp/firebase-config.js','utf8'); const m=s.match(/apiKey:\\s*\\\"([^\\\"]+)\\\"/); if(!m){process.exit(1)}; process.stdout.write(m[1]);")
          echo "FIREBASE_WEB_API_KEY=$API_KEY" >> "$GITHUB_ENV"

      - name: Resolve proxy URL from Cloud Run
        run: |
          URL=$(gcloud run services describe vbai-proxy --project gen-lang-client-0462350485 --region asia-southeast1 --format='value(status.url)')
          echo "VBAI_PROXY_BASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Mint Firebase ID token for canary
        working-directory: proxy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.GCP_SA_KEY }}
          FIREBASE_WEB_API_KEY: ${{ env.FIREBASE_WEB_API_KEY }}
        run: |
          TOKEN=$(npm run --silent test:mint-token)
          echo "::add-mask::$TOKEN"
          echo "VBAI_TEST_ID_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run runtime canary
        working-directory: proxy
        env:
          VBAI_PROXY_BASE_URL: ${{ env.VBAI_PROXY_BASE_URL }}
          VBAI_TEST_ID_TOKEN: ${{ env.VBAI_TEST_ID_TOKEN }}
        run: npm run test:canary
