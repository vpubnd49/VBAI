name: Web Search Canary

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install proxy dependencies
        working-directory: proxy
        run: npm ci

      - name: Check required secrets
        id: secret_check
        env:
          BASE_URL: ${{ secrets.VBAI_PROXY_BASE_URL }}
          ID_TOKEN: ${{ secrets.VBAI_TEST_ID_TOKEN }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$ID_TOKEN" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "Skipping canary: missing VBAI_PROXY_BASE_URL or VBAI_TEST_ID_TOKEN"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run runtime canary
        if: steps.secret_check.outputs.missing == 'false'
        working-directory: proxy
        env:
          VBAI_PROXY_BASE_URL: ${{ secrets.VBAI_PROXY_BASE_URL }}
          VBAI_TEST_ID_TOKEN: ${{ secrets.VBAI_TEST_ID_TOKEN }}
        run: npm run test:canary
