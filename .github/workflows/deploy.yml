name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: alvb-app-83921
  SERVICE_NAME: vbai-app
  REGION: asia-southeast1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend proxy
        id: deploy-proxy
        run: |
          gcloud run deploy vbai-proxy \
            --source ./proxy \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --max-instances 3
          PROXY_URL=$(gcloud run services describe vbai-proxy --region ${{ env.REGION }} --format='value(status.url)')
          echo "proxy_url=$PROXY_URL" >> $GITHUB_OUTPUT

      - name: Deploy frontend
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source ./webapp \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --max-instances 3 \
            --set-env-vars API_BASE_URL=${{ steps.deploy-proxy.outputs.proxy_url }}
