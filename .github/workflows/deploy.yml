name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: gen-lang-client-0462350485
  SERVICE_NAME: vbai
  REGION: asia-southeast1
  # Optional overrides. Leave empty to use Cloud Run defaults and avoid actAs IAM failures.
  BUILD_SERVICE_ACCOUNT: projects/gen-lang-client-0462350485/serviceAccounts/github-deployer@gen-lang-client-0462350485.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: ""

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check mojibake in webapp strings
        run: |
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'webapp';
          const exts = new Set(['.js', '.css', '.html']);
          const skip = new Set(['node_modules', 'dist', '.git']);
          const suspectPair = /(?:[\u00C2\u00C3\u00C4\u00C6\u00D0\u00D1\u00E2\u00E3\u00F0\u00EF][\u0080-\u00BF])/u;
          const suspectReplacement = /\uFFFD/u;
          const hits = [];

          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              if (skip.has(name)) continue;
              const p = path.join(dir, name);
              const st = fs.statSync(p);
              if (st.isDirectory()) {
                walk(p);
                continue;
              }
              if (!exts.has(path.extname(p))) continue;
              const text = fs.readFileSync(p, 'utf8');
              const lines = text.split(/\r?\n/);
              lines.forEach((line, idx) => {
                if (suspectPair.test(line) || suspectReplacement.test(line)) {
                  hits.push(`${p}:${idx + 1}: ${line.slice(0, 180)}`);
                }
              });
            }
          }

          walk(root);
          if (hits.length) {
            console.error('Detected possible mojibake sequences in webapp files:');
            for (const h of hits.slice(0, 60)) console.error(h);
            process.exit(1);
          }
          console.log('Mojibake check passed.');
          NODE

      - name: Run proxy golden legal tests
        working-directory: proxy
        run: |
          npm ci
          npm run test:golden

      - name: Run webapp legal policy tests
        working-directory: webapp
        run: |
          npm ci
          npm run test:policy

      # IMPORTANT:
      # secrets.GCP_SA_KEY must contain credentials for a service account
      # that has access to PROJECT_ID above.
      # Example recommended service account:
      # github-deployer@gen-lang-client-0462350485.iam.gserviceaccount.com
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify auth and project
        run: |
          echo "Expected project: ${{ env.PROJECT_ID }}"
          gcloud auth list
          gcloud config set project ${{ env.PROJECT_ID }}
          gcloud config get-value project
          gcloud projects describe ${{ env.PROJECT_ID }} --format='value(projectId)'

      - name: Select GCP project
        run: gcloud config set project ${{ env.PROJECT_ID }}



      - name: Deploy backend proxy
        id: deploy-proxy
        run: |
          set -euo pipefail
          BUILD_SA_FLAG=""
          RUNTIME_SA_FLAG=""
          if [ -n "${BUILD_SERVICE_ACCOUNT:-}" ]; then
            BUILD_SA_FLAG="--build-service-account ${BUILD_SERVICE_ACCOUNT}"
          fi
          if [ -n "${RUNTIME_SERVICE_ACCOUNT:-}" ]; then
            RUNTIME_SA_FLAG="--service-account ${RUNTIME_SERVICE_ACCOUNT}"
          fi

          gcloud run deploy vbai-proxy \
            --quiet \
            --project ${{ env.PROJECT_ID }} \
            --source ./proxy \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --max-instances 3 \
            --set-env-vars MAX_AUDIO_UPLOAD_MB=80 \
            ${BUILD_SA_FLAG} \
            ${RUNTIME_SA_FLAG}
          PROXY_URL=$(gcloud run services describe vbai-proxy --project ${{ env.PROJECT_ID }} --region ${{ env.REGION }} --format='value(status.url)')
          echo "proxy_url=$PROXY_URL" >> $GITHUB_OUTPUT

      - name: Deploy frontend
        run: |
          set -euo pipefail
          BUILD_SA_FLAG=""
          RUNTIME_SA_FLAG=""
          if [ -n "${BUILD_SERVICE_ACCOUNT:-}" ]; then
            BUILD_SA_FLAG="--build-service-account ${BUILD_SERVICE_ACCOUNT}"
          fi
          if [ -n "${RUNTIME_SERVICE_ACCOUNT:-}" ]; then
            RUNTIME_SA_FLAG="--service-account ${RUNTIME_SERVICE_ACCOUNT}"
          fi

          ATTEMPTS=2
          COUNT=1
          until [ "$COUNT" -gt "$ATTEMPTS" ]; do
            echo "Frontend deploy attempt $COUNT/$ATTEMPTS"
            if gcloud run deploy ${{ env.SERVICE_NAME }} \
              --quiet \
              --project ${{ env.PROJECT_ID }} \
              --source ./webapp \
              --region ${{ env.REGION }} \
              --allow-unauthenticated \
              --port 8080 \
              --memory 256Mi \
              --max-instances 3 \
              --set-env-vars API_BASE_URL=${{ steps.deploy-proxy.outputs.proxy_url }} \
              ${BUILD_SA_FLAG} \
              ${RUNTIME_SA_FLAG}; then
              echo "Frontend deploy succeeded on attempt $COUNT"
              break
            fi
            if [ "$COUNT" -eq "$ATTEMPTS" ]; then
              echo "Frontend deploy failed after $ATTEMPTS attempts"
              exit 1
            fi
            echo "Frontend deploy failed on attempt $COUNT, retrying in 15s..."
            COUNT=$((COUNT + 1))
            sleep 15
          done
