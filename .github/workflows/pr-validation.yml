name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Security Gate (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/secret-scan.cjs

  proxy-tests:
    name: Proxy Tests
    needs: security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:golden

  webapp-tests:
    name: Webapp Tests & Build
    needs: security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run test:all
      - run: npm run build
