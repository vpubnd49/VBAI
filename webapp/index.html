<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trợ lý hành chính</title>
  <meta name="description" content="Trợ lý hành chính là nền tảng hỗ trợ hành chính số, tra cứu pháp luật, soạn thảo văn bản, kiểm tra thể thức, xử lý PDF/DOCX và tổng hợp ghi âm cuộc họp." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Login Overlay (Hidden by default, controlled by main.js) -->
  <div id="login-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; background:var(--bg-primary); overflow-y:auto;"></div>

  <div id="app" style="display:none;">
    <!-- Ambient background -->
    <div class="ambient-bg">
      <div class="ambient-orb orb-1"></div>
      <div class="ambient-orb orb-2"></div>
      <div class="ambient-orb orb-3"></div>
    </div>

    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar collapsed">
      <div class="sidebar-header">
        <div class="logo" id="logo-refresh" style="cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
          <div class="logo-icon">
            <img src="/admin-assistant-logo.svg" alt="Logo Trợ lý hành chính" style="width: 100%; height: 100%; border-radius: var(--radius-md); object-fit: cover;">
          </div>
          <div class="logo-text">
            <span class="logo-name">Trợ lý hành chính</span>
            <span class="logo-sub">Trợ lý hành chính số chuyên nghiệp</span>
          </div>
        </div>
      </div>

      <div class="sidebar-menu">
        <button class="nav-item active" data-page="dashboard" id="nav-dashboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span>Tổng quan</span>
        </button>

        <div class="nav-section-label">Tra cứu</div>

        <button class="nav-item" data-page="chat-assistant" id="nav-chat-assistant">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Tra cứu hành chính & pháp luật</span>
        </button>

        <div class="nav-section-label">Soạn khối Chính quyền</div>

        <button class="nav-item" data-page="vb-nd30" id="nav-vb-nd30">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 3h10c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 7h6M7 10h4M7 13h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span>Soạn VB Hành chính (NĐ30)</span>
        </button>

        <div class="nav-section-label">Soạn khối Đảng</div>

        <button class="nav-item" data-page="vb-dang" id="nav-vb-dang">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 2l1.9 5.8H18l-4.9 3.6 1.9 5.8L10 13.6l-4.9 3.6 1.9-5.8L2 7.8h6.1L10 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span>Soạn VB Đảng (HD05)</span>
        </button>

        <div class="nav-section-label">Xử lý thông minh</div>

        <button class="nav-item" data-page="pdf-tool" id="nav-pdf-tool">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 2h7l5 5v11a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 2v5h5" stroke="currentColor" stroke-width="1.5"/>
            <text x="5.5" y="15" font-size="6" font-weight="700" fill="currentColor">PDF</text>
          </svg>
          <span>Xử lý PDF / OCR</span>
        </button>

        <button class="nav-item" data-page="spell-check" id="nav-spell-check">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M9 2a7 7 0 105.3 11.5l3.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 9l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Kiểm tra chính tả & thể thức</span>
        </button>

        <button class="nav-item" data-page="meeting-minutes" id="nav-meeting-minutes">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 2a3 3 0 00-3 3v5a3 3 0 006 0V5a3 3 0 00-3-3z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5 10v1a5 5 0 0010 0v-1M10 16v2M8 18h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Xử lý ghi âm cuộc họp</span>
        </button>

        <button class="nav-item" data-page="docx-tool" id="nav-docx-tool">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 2h7l5 5v11a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 2v5h5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 11h6M7 14h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span>Tạo & Xuất DOCX</span>
        </button>

        <button class="nav-item" data-page="pdf-publisher" id="nav-pdf-publisher">
          <div class="nav-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <span>Công cụ Tóm tắt - Xuất PDF</span>
        </button>

        <div class="nav-section-label">Quản trị</div>

        <button class="nav-item" data-page="admin-panel" id="nav-admin-panel" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Quản Trị Hệ Thống</span>
        </button>

        <button class="nav-item" id="nav-contact" style="color: var(--pine-400); margin-bottom: 8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.27-2.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <span>Liên hệ hỗ trợ</span>
        </button>
      </div>

      <div style="margin-top: auto; padding: 16px;">
        <button class="nav-item" id="btn-logout" style="color: var(--daquy-500); width: 100%;">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M7 10h10M13 6l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 3H5a2 2 0 00-2 2v10a2 2 0 002 2h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Đăng xuất</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="version-badge" id="app-version">v1.2.6</div>
      </div>

    </nav>

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Header bar -->
      <header class="top-bar">
        <button id="toggle-sidebar" class="btn-icon" aria-label="Toggle Sidebar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="breadcrumb" id="breadcrumb">
          <span class="breadcrumb-item">Tổng quan</span>
        </div>
        <div class="top-bar-actions">
          <div class="dalat-time" id="dalat-clock"></div>
        </div>
      </header>

      <!-- Page content area -->
      <div id="page-content" class="page-content">
        <!-- Dynamic content loaded here -->
      </div>
    </main>
  </div>

  <script src="/runtime-config.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
