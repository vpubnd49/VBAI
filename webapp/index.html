<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VBAI Legal Pro V2 - Tra cứu & Kiểm chứng Pháp luật</title>
  <meta name="description" content="Nền tảng AI tra cứu, kiểm chứng và phân tích pháp luật Việt Nam dành cho công tác tham mưu, hành chính và pháp chế." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Login Overlay (Hidden by default, controlled by main.js) -->
  <div id="login-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; background:var(--bg-primary); overflow-y:auto;"></div>

  <div id="app" style="display:none;">
    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar collapsed">
      <div class="sidebar-header">
        <div class="logo" id="logo-refresh" style="cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
          <img src="/legal-pro-logo.svg" alt="VBAI Legal Pro V2" style="height: 36px; width: auto; max-width: 100%; object-fit: contain;">
        </div>
      </div>

      <div class="sidebar-menu">
        <!-- SECTION I: VBAI LEGAL PRO -->
        <div class="nav-section-label">I. VBAI LEGAL PRO</div>
        <button class="nav-item active" data-page="dashboard" id="nav-dashboard">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span>Tổng quan</span>
        </button>

        <button class="nav-item" data-page="chat-assistant" id="nav-chat-assistant">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Trợ lý Chat AI</span>
        </button>

        <!-- SECTION II: TRA CỨU PHÁP LUẬT -->
        <div class="nav-section-label">II. TRA CỨU PHÁP LUẬT</div>
        <button class="nav-item" data-page="legal-search" id="nav-legal-search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Tra cứu pháp luật</span>
        </button>

        <button class="nav-item" data-page="document-lookup" id="nav-document-lookup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span>Tra cứu văn bản</span>
        </button>

        <button class="nav-item" data-page="situation-analysis" id="nav-situation-analysis">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          </svg>
          <span>Phân tích tình huống</span>
        </button>

        <button class="nav-item" data-page="compare-regulations" id="nav-compare-regulations">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span>So sánh quy định</span>
        </button>

        <button class="nav-item" data-page="effective-date" id="nav-effective-date">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Hiệu lực & sửa đổi</span>
        </button>

        <!-- SECTION III: CÔNG CỤ PHÁP LÝ -->
        <div class="nav-section-label">III. CÔNG CỤ PHÁP LÝ</div>
        <button class="nav-item" data-page="spell-check" id="nav-spell-check">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M9 2a7 7 0 105.3 11.5l3.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 9l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Kiểm tra văn bản & thể thức</span>
        </button>

        <button class="nav-item" data-page="pdf-tool" id="nav-pdf-tool">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 2h7l5 5v11a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 2v5h5" stroke="currentColor" stroke-width="1.5"/>
            <text x="5.5" y="15" font-size="6" font-weight="700" fill="currentColor">PDF</text>
          </svg>
          <span>OCR / Đọc tài liệu</span>
        </button>

        <button class="nav-item" data-page="pdf-publisher" id="nav-pdf-publisher">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <span>Tóm tắt hồ sơ & Xuất PDF</span>
        </button>

        <!-- SECTION IV: SOẠN THẢO -->
        <div class="nav-section-label">IV. SOẠN THẢO</div>
        <button class="nav-item" data-page="vb-nd30" id="nav-vb-nd30">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 3h10c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 7h6M7 10h4M7 13h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <span>Văn bản hành chính NĐ30</span>
        </button>

        <button class="nav-item" data-page="vb-dang" id="nav-vb-dang">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 2l1.9 5.8H18l-4.9 3.6 1.9 5.8L10 13.6l-4.9 3.6 1.9-5.8L2 7.8h6.1L10 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <span>Văn bản Đảng HD05</span>
        </button>

        <button class="nav-item" data-page="docx-tool" id="nav-docx-tool">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M5 2h7l5 5v11a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 2v5h5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span>Tạo DOCX / PDF</span>
        </button>

        <!-- SECTION V: CUỘC HỌP -->
        <div class="nav-section-label">V. CUỘC HỌP</div>
        <button class="nav-item" data-page="meeting-minutes" id="nav-meeting-minutes">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M10 2a3 3 0 00-3 3v5a3 3 0 006 0V5a3 3 0 00-3-3z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M5 10v1a5 5 0 0010 0v-1M10 16v2M8 18h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Xử lý ghi âm & Biên bản</span>
        </button>

        <!-- SECTION VI: HỆ THỐNG -->
        <div class="nav-section-label">VI. HỆ THỐNG</div>
        <button class="nav-item" data-page="search-history" id="nav-search-history">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Lịch sử tra cứu</span>
        </button>

        <button class="nav-item" data-page="admin-panel" id="nav-admin-panel" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Quản trị hệ thống</span>
        </button>

        <button class="nav-item" id="nav-contact" style="color: var(--pine-400); margin-bottom: 8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.27-2.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <span>Liên hệ hỗ trợ</span>
        </button>
      </div>

      <div style="margin-top: auto; padding: 16px;">
        <button class="nav-item" id="btn-logout" style="color: var(--rose-500); width: 100%;">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M7 10h10M13 6l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 3H5a2 2 0 00-2 2v10a2 2 0 002 2h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Đăng xuất</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="version-badge" id="app-version">VBAI Legal Pro V2</div>
      </div>

    </nav>

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
      <!-- Header bar -->
      <header class="top-bar">
        <button id="toggle-sidebar" class="btn-icon" aria-label="Toggle Sidebar">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="breadcrumb" id="breadcrumb">
          <span class="breadcrumb-item">VBAI Legal Pro V2</span>
        </div>
        <div class="top-bar-actions">
          <div class="dalat-time" id="dalat-clock"></div>
        </div>
      </header>

      <!-- Page content area -->
      <div id="page-content" class="page-content">
        <!-- Dynamic content loaded here -->
      </div>
    </main>
  </div>

  <script src="/runtime-config.js"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
