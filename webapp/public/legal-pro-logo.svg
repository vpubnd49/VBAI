<svg width="210" height="40" viewBox="0 0 210 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-v-grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006D5B" />
      <stop offset="100%" stop-color="#1A56DB" />
    </linearGradient>
    <radialGradient id="logo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00BCD4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#006D5B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- V icon with AI glow dot -->
  <g transform="translate(2, 2)">
    <!-- V shape -->
    <path d="M4 6L16 30L28 6L23 6L16 22L9 6Z" fill="url(#logo-v-grad)" />
    <!-- Inner V cutout for depth -->
    <path d="M9.5 8L16 23L22.5 8L20 8L16 17.5L12 8Z" fill="white" opacity="0.15" />
    <!-- AI glow -->
    <circle cx="16" cy="26" r="5" fill="url(#logo-glow)" />
    <!-- AI dot core -->
    <circle cx="16" cy="26" r="2" fill="#00E5FF" />
    <circle cx="16" cy="26" r="1" fill="white" />
  </g>

  <!-- Typography -->
  <text x="42" y="21" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#0F172A">VBAI Legal <tspan fill="#006D5B">PRO</tspan></text>
  <text x="42" y="32" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="0.2">Nền tảng Pháp lý AI Việt Nam</text>
</svg>
